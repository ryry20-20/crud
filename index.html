<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Record Management System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f4f4;
    }
    h1 {
      text-align: center;
    }
    form {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    input {
      padding: 5px;
      font-size: 16px;
    }
    button {
      padding: 6px 12px;
      font-size: 16px;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: left;
    }
    th {
      background: #333;
      color: #fff;
    }
    tr:nth-child(even) {
      background: #f9f9f9;
    }
    .action-btn {
      margin-right: 5px;
      padding: 4px 8px;
    }
  </style>
</head>
<body>

  <h1>Record Management System</h1>

  <form id="recordForm">
    <input type="hidden" id="recordIndex">
    <input type="text" id="name" placeholder="Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="text" id="role" placeholder="Role" required>
    <button type="submit">Add / Update Record</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="recordTableBody">
      <!-- Records will appear here -->
    </tbody>
  </table>

  <script>
    let records = [];

    const form = document.getElementById('recordForm');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const roleInput = document.getElementById('role');
    const recordIndexInput = document.getElementById('recordIndex');
    const tableBody = document.getElementById('recordTableBody');

    // Render table
    function renderTable() {
      tableBody.innerHTML = '';
      records.forEach((record, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${record.name}</td>
          <td>${record.email}</td>
          <td>${record.role}</td>
          <td>
            <button class="action-btn" onclick="editRecord(${index})">Edit</button>
            <button class="action-btn" onclick="deleteRecord(${index})">Delete</button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    // Add or Update record
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = nameInput.value;
      const email = emailInput.value;
      const role = roleInput.value;
      const recordIndex = recordIndexInput.value;

      if (recordIndex === '') {
        // Add new record
        records.push({ name, email, role });
      } else {
        // Update existing record
        records[recordIndex] = { name, email, role };
        recordIndexInput.value = '';
      }

      form.reset();
      renderTable();
    });

    // Edit record
    function editRecord(index) {
      const record = records[index];
      nameInput.value = record.name;
      emailInput.value = record.email;
      roleInput.value = record.role;
      recordIndexInput.value = index;
    }

    // Delete record
    function deleteRecord(index) {
      if (confirm('Are you sure you want to delete this record?')) {
        records.splice(index, 1);
        renderTable();
      }
    }

    // Initial render
    renderTable();
  </script>

</body>
</html>
