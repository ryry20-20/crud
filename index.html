<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinic Record Management System</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Roboto', sans-serif;
    background: #f4f6f9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Navbar */
  nav {
    width: 100%;
    background: #007bff;
    color: #fff;
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  nav h2 { font-weight: 700; font-size: 20px; }
  nav button {
    background: #dc3545;
    padding: 8px 15px;
    border: none;
    border-radius: 5px;
    color: #fff;
    cursor: pointer;
    transition: background 0.3s;
    display: none;
  }
  nav button:hover { background: #b02a37; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  header h1 {
    margin-bottom: 30px;
    font-size: 28px;
    color: #333;
    text-align: center;
  }

  /* Forms */
  form {
    display: flex;
    flex-direction: column;
    gap: 15px;
    max-width: 400px;
    width: 100%;
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
  }

  input {
    padding: 12px;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid #ccc;
    width: 100%;
  }

  button {
    font-size: 16px;
    padding: 12px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    background: #007bff;
    color: #fff;
    transition: background 0.3s;
  }
  button:hover { background: #0056b3; }

  /* Record Form */
  #recordForm {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: space-between;
    background: #fff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    max-width: 800px;
    width: 100%;
    margin-bottom: 20px;
  }
  #recordForm input { flex: 1 1 220px; }
  #recordForm button { flex: 1 1 120px; background: #28a745; }
  #recordForm button:hover { background: #218838; }

  /* Search */
  #searchInput {
    max-width: 800px;
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border-radius: 12px;
    border: 1px solid #ccc;
    font-size: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }

  /* Table */
  .table-container {
    width: 100%;
    max-width: 800px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    box-shadow: 0 6px 20px rgba(0,0,0,0.05);
    border-radius: 12px;
    overflow: hidden;
    font-size: 14px; /* smaller font for a professional look */
  }
  th, td {
    padding: 10px 8px; /* tighter padding */
    border-bottom: 1px solid #ddd;
    text-align: left;
  }
  th {
    background: #007bff;
    color: #fff;
    font-weight: 500;
    font-size: 13px; /* smaller header font */
  }
  tr:nth-child(even) { background: #f9f9f9; }
  tr:hover { background: #e2f0ff; transition: 0.2s; }

  .action-btn {
    padding: 4px 8px; /* smaller buttons */
    border-radius: 4px;
    font-size: 12px;
    margin-right: 5px;
    border: none;
    color: #fff;
    cursor: pointer;
  }
  .edit-btn { background: #ffc107; }
  .delete-btn { background: #dc3545; }

  /* Footer */
  footer {
    width: 100%;
    background: #007bff;
    color: #fff;
    text-align: center;
    padding: 15px;
    font-size: 14px;
    box-shadow: 0 -2px 6px rgba(0,0,0,0.1);
    margin-top: auto;
  }

  #recordSection { display: none; width: 100%; }
  #loginSection { width: 100%; display: flex; flex-direction: column; align-items: center; }

</style>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <h2>Clinic Record Management System</h2>
    <button id="logoutBtn">Logout</button>
  </nav>

  <main>
    <!-- Login -->
    <div id="loginSection">
      <header>
        <h1>Login</h1>
      </header>
      <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
    </div>

    <!-- Records -->
    <div id="recordSection">
      <header>
        <h1>Manage Patients</h1>
      </header>

      <!-- Search -->
      <input type="text" id="searchInput" placeholder="Search by Name or Email">

      <!-- Record Form -->
      <form id="recordForm">
        <input type="hidden" id="recordIndex">
        <input type="text" id="name" placeholder="Patient Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <button type="submit">Add / Update</button>
      </form>

      <!-- Table -->
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="recordTableBody">
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2025 Clinic Record Management System. All rights reserved.
  </footer>

<script>
const demoUsername = "ryan";
const demoPassword = "ryan123";

const loginForm = document.getElementById('loginForm');
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const loginSection = document.getElementById('loginSection');
const recordSection = document.getElementById('recordSection');
const logoutBtn = document.getElementById('logoutBtn');
const searchInput = document.getElementById('searchInput');

loginForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const username = usernameInput.value.trim();
  const password = passwordInput.value.trim();

  if(username === demoUsername && password === demoPassword) {
    loginSection.style.display = 'none';
    recordSection.style.display = 'block';
    logoutBtn.style.display = 'inline-block';
  } else {
    alert('Invalid username or password');
  }
});

logoutBtn.addEventListener('click', () => {
  recordSection.style.display = 'none';
  loginSection.style.display = 'flex';
  loginForm.reset();
  logoutBtn.style.display = 'none';
});

// CRUD
let records = [];
const form = document.getElementById('recordForm');
const nameInput = document.getElementById('name');
const emailInput = document.getElementById('email');
const recordIndexInput = document.getElementById('recordIndex');
const tableBody = document.getElementById('recordTableBody');

function renderTable() {
  const filter = searchInput.value.toLowerCase();
  tableBody.innerHTML = '';
  records.forEach((record, index) => {
    if(record.name.toLowerCase().includes(filter) || record.email.toLowerCase().includes(filter)) {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${record.name}</td>
        <td>${record.email}</td>
        <td>
          <button class="action-btn edit-btn" onclick="editRecord(${index})">Edit</button>
          <button class="action-btn delete-btn" onclick="deleteRecord(${index})">Delete</button>
        </td>
      `;
      tableBody.appendChild(row);
    }
  });
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const name = nameInput.value.trim();
  const email = emailInput.value.trim();
  const recordIndex = recordIndexInput.value;

  if(recordIndex === '') {
    records.push({name, email});
  } else {
    records[recordIndex] = {name, email};
    recordIndexInput.value = '';
  }

  form.reset();
  renderTable();
});

window.editRecord = function(index) {
  const record = records[index];
  nameInput.value = record.name;
  emailInput.value = record.email;
  recordIndexInput.value = index;
}

window.deleteRecord = function(index) {
  if(confirm('Are you sure you want to delete this record?')) {
    records.splice(index, 1);
    renderTable();
  }
}

searchInput.addEventListener('input', renderTable);

renderTable();
</script>
</body>
</html>
